<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사고 후 대응 지원 · Local board</title><link rel="stylesheet" href="/editor/style.css"></head>
<body>
<header><div><span class="eyebrow">현대차 제안 · 작업 공간</span><h1>사고 후 대응 지원</h1></div><div class="header-actions"><span id="save-state" class="badge">Local 정본</span><button id="download">JSON 내려받기</button><button id="save" class="primary">저장하기</button></div></header>
<nav class="toolbar" aria-label="Board 도구"><div class="group"><label class="sr-only" for="page-select">Page</label><select id="page-select"></select><button id="add">＋ 도형</button><button id="connect" aria-pressed="false">연결하기</button><button id="undo" aria-label="실행 취소">↶</button><button id="redo" aria-label="다시 실행">↷</button></div><div class="group"><button id="zoom-out" aria-label="축소">−</button><output id="zoom">100%</output><button id="zoom-in" aria-label="확대">＋</button><button id="fit">전체 보기</button><button id="svg-export">SVG 내보내기</button><button id="inspector-toggle" aria-expanded="false">편집 열기</button></div></nav>
<main><aside class="outline" aria-label="Board 탐색"><label for="search">내용 찾기</label><input id="search" type="search" placeholder="문구 또는 object ID"><p class="muted" id="page-count"></p><p class="note" id="visual-note" hidden></p><div id="outline-list"></div><details class="archive-info"><summary>원본 보존·가져오기</summary><p>모든 object의 원래 속성을 JSON에 보존합니다. 이전 시안과 낙서도 포함합니다.</p><a id="original-svg" target="_blank" rel="noopener">원본 page SVG 열기</a><a href="/assets/duplicate-26-549.svg" target="_blank" rel="noopener">복제 section 원형 열기</a><label class="file-label">Project JSON 열기<input type="file" id="import" accept=".json,application/json"></label><a href="/editor/catalog.html" target="_blank">UI 기준 보기</a></details></aside>
<section id="viewport" aria-label="편집 가능한 전체 board"><svg id="board" xmlns="http://www.w3.org/2000/svg" aria-label="Diagram"></svg><p class="hint" id="hint">도형 선택 후 오른쪽에서 편집 · 빈 곳을 끌어 이동 · ⌘/Ctrl + wheel 확대</p></section>
<aside id="inspector" class="inspector" aria-label="선택 항목 편집"></aside></main>
<footer><span id="status" role="status" aria-live="polite">Board를 여는 중…</span><span>Local 저장 · Git으로 변경 이력 관리</span></footer>
<script type="module" src="/editor/app.mjs"></script></body></html>
