<script id="flow-core">
const KINDS={start:'시작',state:'동시에 확인',decision:'판단',action:'조건에 따라 실행',urgent:'안전·구호 우선',unknown:'미확인 대응',system:'System 병행',note:'상태 갱신',end:'종료'};
function clone(value){return JSON.parse(JSON.stringify(value))}
function escapeXML(value){return String(value).replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[c]))}
function dataText(value){return JSON.stringify(value).replace(/</g,'\\u003c')}
function validateGraph(graph){
  if(graph?.version!==1||!Array.isArray(graph.nodes)||!Array.isArray(graph.edges))throw Error('문서 형식이 올바르지 않습니다.');
  const ids=new Set();
  for(const n of graph.nodes){if(typeof n.id!=='string'||ids.has(n.id)||!Object.hasOwn(KINDS,n.kind)||typeof n.title!=='string'||typeof n.body!=='string'||!['x','y','w','h'].every(k=>Number.isFinite(n[k]))||n.w<160||n.h<40)throw Error('Node 정보가 올바르지 않습니다.');ids.add(n.id)}
  const edgeIds=new Set();
  for(const e of graph.edges){if(typeof e.id!=='string'||edgeIds.has(e.id)||!ids.has(e.from)||!ids.has(e.to)||e.from===e.to||typeof e.label!=='string')throw Error('연결 정보가 올바르지 않습니다.');for(const side of [e.fromSide,e.toSide])if(side&&!['top','bottom','left','right'].includes(side))throw Error('연결 방향이 올바르지 않습니다.');edgeIds.add(e.id)}
  return graph;
}
function anchor(n,side){return side==='left'?{x:n.x,y:n.y+n.h/2}:side==='right'?{x:n.x+n.w,y:n.y+n.h/2}:side==='top'?{x:n.x+n.w/2,y:n.y}:{x:n.x+n.w/2,y:n.y+n.h}}
function edgeGeometry(e,nodes){
  const a=nodes.find(n=>n.id===e.from),b=nodes.find(n=>n.id===e.to);
  const horizontal=Math.abs(b.x-a.x)>Math.abs(b.y-a.y);
  const fs=e.fromSide||(horizontal?(b.x>a.x?'right':'left'):(b.y>a.y?'bottom':'top'));
  const ts=e.toSide||(horizontal?(b.x>a.x?'left':'right'):(b.y>a.y?'top':'bottom'));
  const p=anchor(a,fs),q=anchor(b,ts);let d,lx,ly;
  if(e.route==='outside-right'){const x=Math.max(...nodes.map(n=>n.x+n.w))+65;d=`M ${p.x} ${p.y} H ${x} V ${q.y} H ${q.x}`;lx=x-10;ly=(p.y+q.y)/2;return{d,lx,ly,vertical:true}}
  if(e.route==='outside-left'){const x=Math.min(...nodes.map(n=>n.x))-35,bridgeY=Math.min(a.y,b.y+b.h)+45,approachX=b.x-45;d=`M ${p.x} ${p.y} H ${x} V ${bridgeY} H ${approachX} V ${q.y} H ${q.x}`;lx=x+12;ly=(p.y+bridgeY)/2;return{d,lx,ly,vertical:true}}
  if(['left','right'].includes(fs)&&['left','right'].includes(ts)){const mid=(p.x+q.x)/2;d=`M ${p.x} ${p.y} H ${mid} V ${q.y} H ${q.x}`;lx=mid;ly=(p.y+q.y)/2-10}
  else if(['top','bottom'].includes(fs)&&['top','bottom'].includes(ts)){const mid=(p.y+q.y)/2;d=`M ${p.x} ${p.y} V ${mid} H ${q.x} V ${q.y}`;lx=(p.x+q.x)/2;ly=mid-10}
  else{d=`M ${p.x} ${p.y} L ${q.x} ${q.y}`;lx=(p.x+q.x)/2;ly=(p.y+q.y)/2-10}
  return{d,lx,ly,vertical:false};
}

<script id="flow-editor">

function renderInspector(){

  if(!selected){heading.textContent='Flow의 읽는 법';const intro=document.createElement('p');intro.textContent='위에서 아래로 읽으세요. 각 node와 연결선을 눌러 내용을 바꿀 수 있습니다.';inspector.append(intro);const list=document.createElement('ol');list.className='principles';for(const[title,body]of[['상태는 동시에 확인','사람·현장·차량 정보를 따로 갱신합니다. 모르는 항목을 억지로 확정하지 않습니다.'],['필요한 대응은 함께 활성화','세 대응은 배타적인 선택지가 아닙니다. 안전·구호를 우선하고 이동에는 실행 조건을 둡니다.'],['새 정보가 오면 다시 판단','도움 연결과 안전 확보를 구분합니다. 후속 처리가 가능해졌는지 별도로 확인합니다.']]){const li=document.createElement('li'),strong=document.createElement('strong'),span=document.createElement('span');strong.textContent=title;span.textContent=body;li.append(strong,span);list.append(li)}inspector.append(list);const legend=document.createElement('div');legend.className='legend';for(const[kind,label]of[['decision','판단·진행 조건'],['urgent','안전·구호 대응'],['unknown','미확인 대응'],['system','운전자 조작 없이 병행']]){const row=document.createElement('div');row.className='legend-row';const mark=document.createElement('span');mark.className='swatch '+kind;row.append(mark,document.createTextNode(label));legend.append(row)}inspector.append(legend);const hr=document.createElement('hr');inspector.append(hr);const note=document.createElement('p');note.className='note';note.textContent='실행 가능한 제품이 아닌 검토용 diagram입니다. 감지·판단 기준과 기관 연결 방식은 별도 검증이 필요합니다.';inspector.append(note);const details=document.createElement('details'),summary=document.createElement('summary'),p=document.createElement('p'),a=document.createElement('a');summary.textContent='안전 우선 원칙 참고';a.href='https://kiri.or.kr/PDF/weeklytrend/20260223/trend20260223_6.pdf';a.target='_blank';a.rel='noopener';a.textContent='금융감독원 등의 사고 대응 안내, p.8';p.append(a);details.append(summary,p);inspector.append(details);return}

function render(){renderNodes();renderWires();renderInspector();updateTools()}
function select(type,id){selected={type,id};render();if(innerWidth<700){inspector.hidden=false;$('toggle-inspector').setAttribute('aria-expanded','true')}}

function redo(){if(!redoStack.length)return;undoStack.push(clone(graph));graph=redoStack.pop();selected=null;setDirty();render()}
function nodeClick(id){if(connectMode){if(!connectFrom){connectFrom=id;render();return}if(connectFrom===id){status('다른 node를 선택하세요.');return}const from=connectFrom;change(()=>{graph.edges.push({id:crypto.randomUUID(),from,to:id,label:''});connectMode=false;connectFrom=null;selected={type:'edge',id:graph.edges.at(-1).id}});return}select('node',id)}
nodeLayer.addEventListener('click',e=>{const node=e.target.closest('.flow-node');if(node)nodeClick(node.dataset.id)});

wires.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const edge=e.target.closest('[data-edge]');if(edge){e.preventDefault();select('edge',edge.dataset.edge)}}});
vp.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('[data-edge]')||e.target.closest('.connect-banner'))return;const el=e.target.closest('.flow-node');if(connectMode&&el)return;vp.setPointerCapture(e.pointerId);if(el){const node=graph.nodes.find(n=>n.id===el.dataset.id);drag={type:'node',id:node.id,sx:e.clientX,sy:e.clientY,x:node.x,y:node.y,before:clone(graph),moved:false}}else{drag={type:'pan',sx:e.clientX,sy:e.clientY,x:view.x,y:view.y,moved:false};vp.classList.add('panning')}e.preventDefault()});
vp.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;if(!drag.moved)return;if(drag.type==='node'){const n=graph.nodes.find(n=>n.id===drag.id);n.x=Math.max(20,Math.round(drag.x+dx/view.k));n.y=Math.max(20,Math.round(drag.y+dy/view.k));const el=nodeLayer.querySelector(`[data-id="${n.id}"]`);el.style.left=n.x+'px';el.style.top=n.y+'px';renderWires()}else{view.x=drag.x+dx;view.y=drag.y+dy;applyView()}});
function stopDrag(e){if(!drag)return;const finished=drag;drag=null;vp.classList.remove('panning');if(vp.hasPointerCapture(e.pointerId))vp.releasePointerCapture(e.pointerId);if(finished.type==='node'){if(finished.moved){remember(finished.before);setDirty()}selected={type:'node',id:finished.id};render();nodeLayer.querySelector(`[data-id="${finished.id}"]`)?.focus({preventScroll:true})}else if(finished.type==='pan'&&!finished.moved){selected=null;render()}}

vp.addEventListener('wheel',e=>{e.preventDefault();if(e.ctrlKey||e.metaKey){const r=vp.getBoundingClientRect();zoom(Math.exp(-e.deltaY*.004),e.clientX-r.left,e.clientY-r.top)}else{view.x-=e.deltaX;view.y-=e.deltaY;applyView()}},{passive:false});
document.addEventListener('keydown',e=>{const editing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);if(e.key==='Escape'){connectMode=false;connectFrom=null;selected=null;render();return}if(editing)return;if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}if(e.key==='Delete'||e.key==='Backspace'){if(selected){e.preventDefault();deleteSelection()}}if(selected?.type==='node'&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const n=graph.nodes.find(n=>n.id===selected.id),step=e.shiftKey?1:10;change(()=>{if(e.key==='ArrowLeft')n.x=Math.max(20,n.x-step);if(e.key==='ArrowRight')n.x+=step;if(e.key==='ArrowUp')n.y=Math.max(20,n.y-step);if(e.key==='ArrowDown')n.y+=step});nodeLayer.querySelector(`[data-id="${n.id}"]`).focus()}});
$('add-node').onclick=()=>{const r=vp.getBoundingClientRect();change(()=>{const id=crypto.randomUUID();graph.nodes.push({id,kind:'action',title:'새 행동',body:'확인할 조건과 행동을 적으세요.',x:Math.max(20,Math.round((r.width/2-view.x)/view.k-180)),y:Math.max(20,Math.round((r.height/2-view.y)/view.k-60)),w:360,h:120});selected={type:'node',id}});$('edit-title').focus();$('edit-title').select();if(inspector.hidden){inspector.hidden=false;$('toggle-inspector').setAttribute('aria-expanded','true')}};
$('connect').onclick=()=>{connectMode=!connectMode;connectFrom=null;updateTools();renderNodes()};$('undo').onclick=undo;$('redo').onclick=redo;$('zoom-in').onclick=()=>zoom(1.2);$('zoom-out').onclick=()=>zoom(1/1.2);$('fit').onclick=fit;

function download(content,type,name){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
$('html-save').onclick=()=>{const doc=document.documentElement.cloneNode(true);doc.querySelector('#flow-data').textContent=dataText(graph);doc.querySelector('#nodes').replaceChildren();doc.querySelector('#wires').replaceChildren();doc.querySelector('#inspector').replaceChildren();download('<!doctype html>\n'+doc.outerHTML,'text/html;charset=utf-8','cha-bun-flow.html');dirty=false;status('현재 편집 내용을 담은 HTML을 저장했습니다. 내려받은 파일을 열면 계속 편집할 수 있습니다.')};

function exportSVG(){
  const b=graphBounds(graph.nodes),colors={state:['#ffffff','#dce1e7'],decision:['#edf7f4','#a8d4ca'],urgent:['#fff2ef','#e8bfb8'],unknown:['#fff8e8','#e4d6b6'],system:['#f0f3f8','#cbd5e2'],note:['#f7f8fa','#bbc5ce'],action:['#ffffff','#dce1e7'],start:['#ffffff','#c0cbc9'],end:['#ffffff','#c0cbc9']};

  for(const e of graph.edges){const p=edgeGeometry(e,graph.nodes);out+=`<g><path d="${p.d}" fill="none" stroke="#929eac" stroke-width="1.7"${e.feedback?' stroke-dasharray="6 5"':''} marker-end="url(#arrow)"/><text x="${p.lx}" y="${p.ly}" ${p.vertical?`transform="rotate(-90 ${p.lx} ${p.ly})"`:''} font-size="14" fill="#647083" text-anchor="middle" paint-order="stroke" stroke="#f7f8fa" stroke-width="7" stroke-linejoin="round">${escapeXML(e.label)}</text></g>`}
  for(const n of graph.nodes){const[c,border]=colors[n.kind],center=['start','end'].includes(n.kind),tx=center?n.x+n.w/2:n.x+18,anchor=center?'middle':'start';out+=`<g data-node-id="${escapeXML(n.id)}"><rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="${center?30:12}" fill="${c}" stroke="${border}" stroke-width="1.4"${n.kind==='note'?' stroke-dasharray="5 4"':''}/><text x="${tx}" y="${n.y+27}" fill="#647083" font-size="12" font-weight="600" text-anchor="${anchor}">${escapeXML(KINDS[n.kind])}</text>`;let y=n.y+53;for(const line of wrap(n.title,n.w-36,21)){out+=`<text x="${tx}" y="${y}" font-size="21" font-weight="600" fill="#202b3b" text-anchor="${anchor}">${escapeXML(line)}</text>`;y+=27}y+=2;for(const line of wrap(n.body,n.w-36,16)){out+=`<text x="${tx}" y="${y}" font-size="16" fill="#4e5b6b" text-anchor="${anchor}">${escapeXML(line)}</text>`;y+=24}out+='</g>'}

$('svg-export').onclick=()=>{download(exportSVG(),'image/svg+xml;charset=utf-8','cha-bun-flow.svg');document.querySelector('.export-menu').open=false;status('현재 diagram을 SVG로 저장했습니다.')};
